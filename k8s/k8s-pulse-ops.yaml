apiVersion: v1
kind: Namespace
metadata:
  name: pulse-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-ops-deployment
  namespace: pulse-ops
  labels:
    app: pulse-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse-ops
  template:
    metadata:
      labels:
        app: pulse-ops
    spec:
      containers:
      - name: pulse-ops-app
        image: sachinthokal/pulse-ops-app:v3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_VERSION
          value: "v1"
        # Downward API: Take pod name directly from Kubernetes
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Downward API: Take node name directly from Kubernetes
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-ops-service
  namespace: pulse-ops
  labels:
    app: pulse-ops
spec:
  type: LoadBalancer
  selector:
    app: pulse-ops
  ports:
  - name: http
    port: 80
    targetPort: 8080